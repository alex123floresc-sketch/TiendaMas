<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo != null} ? ${titulo} + ' · TiendaMas' : 'Comprobante · TiendaMas'"></title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="comprobante-body">

<div class="comprobante-topbar">
  <a th:href="${volverUrl != null} ? ${volverUrl} : '/'" class="ui button">
    <i class="arrow left icon"></i> Volver
  </a>
  <div class="comprobante-topbar-acciones">
    <button type="button" class="ui button" onclick="window.print()">
      <i class="print icon"></i> Imprimir
    </button>
    <a th:if="${pedido != null}" th:href="@{/pedidos/{id}/descargar(id=${pedido.id})}" class="ui button">
      <i class="download icon"></i> Descargar
    </a>
    <form th:if="${pedido != null}" th:action="@{/pedidos/{id}/enviar-correo(id=${pedido.id})}" method="post" style="display:inline;">
      <button type="submit" class="ui button">
        <i class="envelope icon"></i> Enviar a mi correo
      </button>
    </form>
  </div>
</div>

<div class="comprobante-mensaje" th:if="${param.correo != null}">
  <div class="ui message" th:classappend="${param.correo[0] == 'enviado'} ? 'positive' : 'negative'">
    <i class="icon" th:classappend="${param.correo[0] == 'enviado'} ? 'check circle' : 'exclamation triangle'"></i>
    <span th:if="${param.correo[0] == 'enviado'}">Te enviamos el comprobante a tu correo registrado.</span>
    <span th:unless="${param.correo[0] == 'enviado'}">No pudimos enviar el correo. Intenta de nuevo más tarde.</span>
  </div>
</div>

<div class="comprobante-content">
  <div th:insert="~{this :: content}"></div>
</div>

</body>
</html>
