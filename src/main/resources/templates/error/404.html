<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · TiendaMas</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#101B2D">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23101B2D'/%3E%3Cpath d='M7 8h10l-.9 10.1a2 2 0 0 1-2 1.9H9.9a2 2 0 0 1-2-1.9L7 8z' fill='none' stroke='%2360A5FA' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M9 8V6.5a3 3 0 0 1 6 0V8' fill='none' stroke='%2360A5FA' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-page">

<div class="login-box">
    <div class="ui raised segment tienda-error-card">
        <i class="compass outline icon tienda-error-icon"></i>
        <div class="tienda-error-codigo">404</div>
        <h2 class="ui header">Esta página no existe</h2>
        <p>El enlace que seguiste puede estar roto, viejo, o la página se movió de lugar.</p>
        <div class="tienda-error-acciones">
            <a th:href="@{/tienda}" class="ui primary button"><i class="shop icon"></i> Ir a la tienda</a>
            <a th:href="@{/}" class="ui button">Ir al inicio</a>
        </div>
    </div>

    <p class="login-footer">&copy; 2026 TiendaMas · Moda para toda la familia</p>
</div>

</body>
</html>
