<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda}">
<body>
<div th:fragment="content">

    <nav class="tienda-breadcrumbs">
        <a th:href="@{/tienda}">Tienda</a>
        <i class="chevron right icon"></i>
        <span>Mis pedidos</span>
    </nav>

    <h1 class="ui dividing header"><i class="list icon"></i> Mis Pedidos</h1>

    <div class="tienda-empty" th:if="${pedidos.isEmpty()}">
        <i class="list icon"></i>
        <h3>Todavía no tienes pedidos</h3>
        <p>Cuando compres algo en la tienda, tus pedidos van a aparecer acá.</p>
        <a th:href="@{/tienda}" class="ui primary button">Ir al catálogo</a>
    </div>

    <div class="tienda-pedidos-lista" th:unless="${pedidos.isEmpty()}">
        <div class="tienda-pedido-card" th:each="pedido : ${pedidos}">
            <div class="tienda-pedido-card-header">
                <div>
                    <div class="tienda-pedido-card-numero" th:text="${pedido.tipoComprobante} + ' ' + ${pedido.numeroCompleto}"></div>
                    <div class="hint" th:text="${pedido.fechaTexto}"></div>
                </div>
                <div class="tienda-pedido-card-total" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></div>
            </div>

            <div class="tienda-timeline" th:if="${pedido.estado != null and pedido.estado.name() != 'CANCELADO'}">
                <div class="tienda-timeline-paso completado">
                    <span class="dot"></span><span class="label">Pendiente</span>
                </div>
                <div class="tienda-timeline-linea"
                     th:classappend="${pedido.estado.name() == 'EN_CAMINO' or pedido.estado.name() == 'ENTREGADO'} ? 'completado'"></div>
                <div class="tienda-timeline-paso"
                     th:classappend="${pedido.estado.name() == 'EN_CAMINO' or pedido.estado.name() == 'ENTREGADO'} ? 'completado'">
                    <span class="dot"></span><span class="label">En camino</span>
                </div>
                <div class="tienda-timeline-linea" th:classappend="${pedido.estado.name() == 'ENTREGADO'} ? 'completado'"></div>
                <div class="tienda-timeline-paso" th:classappend="${pedido.estado.name() == 'ENTREGADO'} ? 'completado'">
                    <span class="dot"></span><span class="label">Entregado</span>
                </div>
            </div>
            <div class="ui red label" th:if="${pedido.estado != null and pedido.estado.name() == 'CANCELADO'}" style="width:fit-content;">
                <i class="times circle icon"></i> Pedido cancelado
            </div>

            <div class="tienda-pedido-card-footer">
                <span><i class="truck icon"></i> <span th:text="${pedido.tipoEntrega != null ? pedido.tipoEntrega.etiqueta : '—'}"></span></span>
                <span><i class="money bill alternate icon"></i> <span th:text="${pedido.metodoPago != null ? pedido.metodoPago.etiqueta : '—'}"></span></span>
                <a th:if="${pedido.estado != null and pedido.estado.name() == 'ENTREGADO'}"
                   th:href="@{/tienda/pedidos/{id}/devolucion(id=${pedido.id})}" class="ui small button" style="margin-left:auto;">
                    <i class="sync alternate icon"></i> Cambio o devolución
                </a>
                <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="ui small info button"
                   th:style="${pedido.estado != null and pedido.estado.name() == 'ENTREGADO'} ? '' : 'margin-left:auto;'">
                    <i class="eye icon"></i> Ver comprobante
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
