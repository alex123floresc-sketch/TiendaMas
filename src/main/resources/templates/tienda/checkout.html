<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda}">
<body>
<div th:fragment="content">

    <nav class="tienda-breadcrumbs">
        <a th:href="@{/tienda}">Tienda</a>
        <i class="chevron right icon"></i>
        <a th:href="@{/tienda/carrito}">Carrito</a>
        <i class="chevron right icon"></i>
        <span>Finalizar compra</span>
    </nav>

    <h1 class="ui dividing header"><i class="credit card icon"></i> Finalizar compra</h1>

    <div class="tienda-checkout-pasos">
        <div class="tienda-checkout-paso completado"><span>1</span> Carrito</div>
        <div class="tienda-checkout-paso activo"><span>2</span> Envío y pago</div>
        <div class="tienda-checkout-paso"><span>3</span> Confirmación</div>
    </div>

    <div class="ui negative message" th:if="${checkoutError != null}">
        <p th:text="${checkoutError}"></p>
    </div>

    <form th:action="@{/tienda/checkout}" method="post" class="ui form" id="formCheckout">
        <input type="hidden" name="codigoCupon" id="codigoCuponAplicado" value="">
        <input type="hidden" name="culquiToken" id="culquiTokenInput" value="">

        <div class="tienda-checkout-layout">
            <div class="tienda-checkout-form">

                <div class="tienda-checkout-step">
                    <h3 class="ui header">Comprobante a nombre de</h3>
                    <p>
                        <strong th:text="${persona.nombre + ' ' + persona.apellido}"></strong><br>
                        <span th:text="${persona.tipoDocumento} + ' ' + ${persona.numeroDocumento}"></span><br>
                        <span th:text="${persona.direccion}"></span>
                    </p>
                    <a th:href="@{/tienda/perfil}" class="ui small button">Editar mis datos</a>
                </div>

                <div class="tienda-checkout-step">
                    <h3 class="ui header">Tipo de entrega</h3>
                    <div class="field required">
                        <div class="tienda-entrega-opciones">
                            <label class="tienda-entrega-opcion">
                                <input type="radio" name="tipoEntrega" value="RETIRO_TIENDA" checked
                                       onchange="document.getElementById('bloqueDireccionEntrega').style.display='none'; document.getElementById('direccionEntrega').required=false; actualizarResumenEnvio(false);">
                                <i class="warehouse icon"></i> Retiro en tienda
                                <small class="hint">Gratis</small>
                            </label>
                            <label class="tienda-entrega-opcion">
                                <input type="radio" name="tipoEntrega" value="DOMICILIO"
                                       onchange="document.getElementById('bloqueDireccionEntrega').style.display='block'; document.getElementById('direccionEntrega').required=true; actualizarResumenEnvio(true);">
                                <i class="truck icon"></i> Envío a domicilio
                                <small class="hint" th:text="${costoEnvio > 0} ? ('S/ ' + ${#numbers.formatDecimal(costoEnvio, 1, 2)}) : '¡Gratis!'"></small>
                            </label>
                        </div>
                    </div>

                    <div class="field" id="bloqueDireccionEntrega" style="display:none;">
                        <label>Dirección de entrega</label>
                        <textarea name="direccionEntrega" id="direccionEntrega" rows="2"
                                  placeholder="Calle, número, referencia..." th:text="${persona.direccion}"></textarea>
                    </div>
                </div>

                <div class="tienda-checkout-step">
                    <h3 class="ui header">Método de pago</h3>
                    <div class="field required">
                        <div class="tienda-entrega-opciones">
                            <label class="tienda-entrega-opcion">
                                <input type="radio" name="metodoPago" value="EFECTIVO" checked>
                                <i class="money bill alternate icon"></i> Efectivo (contra entrega)
                            </label>
                            <label class="tienda-entrega-opcion" th:classappend="${!culquiConfigurado} ? 'deshabilitado'">
                                <input type="radio" name="metodoPago" value="TARJETA" th:disabled="${!culquiConfigurado}">
                                <i class="credit card icon"></i> Tarjeta de crédito/débito
                                <small class="hint" th:unless="${culquiConfigurado}">No disponible por el momento</small>
                            </label>
                            <label class="tienda-entrega-opcion">
                                <input type="radio" name="metodoPago" value="YAPE_PLIN">
                                <i class="mobile alternate icon"></i> Yape / Plin
                            </label>
                            <label class="tienda-entrega-opcion">
                                <input type="radio" name="metodoPago" value="TRANSFERENCIA">
                                <i class="exchange icon"></i> Transferencia bancaria
                            </label>
                        </div>
                    </div>
                </div>

                <div class="ui negative message" id="culquiError" style="display:none;"></div>

                <button type="submit" class="ui positive big fluid button tienda-checkout-confirmar">
                    <i class="check circle icon"></i> Confirmar pedido
                </button>
            </div>

            <aside class="tienda-carrito-resumen">
                <h3 class="ui header">Resumen del pedido</h3>
                <div class="tienda-checkout-resumen-items">
                    <div class="tienda-checkout-resumen-item" th:each="item : ${carrito.items}">
                        <img th:if="${item.imagenUrl != null}" th:src="@{${item.imagenUrl}}" th:alt="${item.nombre}" loading="lazy">
                        <i th:unless="${item.imagenUrl != null}" class="image icon"></i>
                        <div class="tienda-checkout-resumen-item-info">
                            <span th:text="${item.nombre}"></span>
                            <span class="hint" th:text="${item.cantidad} + ' x S/ ' + ${#numbers.formatDecimal(item.precioUnitario, 1, 2)}"></span>
                        </div>
                        <span th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                    </div>
                </div>
                <div class="tienda-cupon-campo">
                    <input type="text" id="inputCupon" placeholder="Código de cupón" autocomplete="off">
                    <button type="button" class="ui small button" id="btnAplicarCupon">Aplicar</button>
                </div>
                <p class="hint" id="mensajeCupon"></p>

                <div class="tienda-resumen-fila">
                    <span>Subtotal</span>
                    <span th:text="'S/ ' + ${#numbers.formatDecimal(carrito.total, 1, 2)}"></span>
                </div>
                <div class="tienda-resumen-fila" id="filaDescuento" style="display:none;">
                    <span>Descuento</span>
                    <span id="resumenDescuento">- S/ 0.00</span>
                </div>
                <div class="tienda-resumen-fila">
                    <span>Envío</span>
                    <span id="resumenEnvio">Gratis</span>
                </div>
                <div class="tienda-resumen-fila tienda-resumen-total">
                    <span>Total</span>
                    <span id="resumenTotal" th:text="'S/ ' + ${#numbers.formatDecimal(carrito.total, 1, 2)}"></span>
                </div>
                <p class="hint" th:if="${costoEnvio > 0}">
                    Envío gratis en compras desde S/ <span th:text="${#numbers.formatDecimal(envioMontoGratis, 1, 2)}"></span>.
                </p>
            </aside>
        </div>
    </form>

    <script th:if="${culquiConfigurado}" src="https://checkout.culqi.com/js/v4"></script>

    <script th:inline="javascript">
        const SUBTOTAL_CARRITO = /*[[${carrito.total}]]*/ 0;
        const COSTO_ENVIO = /*[[${costoEnvio}]]*/ 0;
        const CULQUI_CONFIGURADO = /*[[${culquiConfigurado}]]*/ false;
        const CULQUI_PUBLIC_KEY = /*[[${culquiPublicKey}]]*/ '';
        const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]').content;
        const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').content;

        let descuentoAplicado = 0;

        if (CULQUI_CONFIGURADO && window.Culqi) {
            Culqi.publicKey = CULQUI_PUBLIC_KEY;
        }

        /* Callback global que invoca Culqui Checkout cuando el cliente termina de cargar su tarjeta. */
        window.culqi = function () {
            if (Culqi.token) {
                document.getElementById('culquiTokenInput').value = Culqi.token.id;
                document.getElementById('culquiError').style.display = 'none';
                document.getElementById('formCheckout').submit();
            } else if (Culqi.error) {
                const error = document.getElementById('culquiError');
                error.textContent = Culqi.error.user_message || 'No se pudo procesar el pago con tarjeta.';
                error.style.display = 'block';
            }
        };

        document.getElementById('formCheckout').addEventListener('submit', function (ev) {
            const metodo = document.querySelector('input[name="metodoPago"]:checked').value;
            if (metodo !== 'TARJETA' || document.getElementById('culquiTokenInput').value) {
                return;
            }
            ev.preventDefault();
            const error = document.getElementById('culquiError');
            if (!CULQUI_CONFIGURADO) {
                error.textContent = 'Los pagos con tarjeta no están disponibles en este momento.';
                error.style.display = 'block';
                return;
            }
            const domicilio = document.querySelector('input[name="tipoEntrega"]:checked').value === 'DOMICILIO';
            const envio = domicilio ? COSTO_ENVIO : 0;
            const totalCentavos = Math.round((SUBTOTAL_CARRITO - descuentoAplicado + envio) * 100);
            Culqi.settings({
                title: 'TiendaMas',
                currency: 'PEN',
                amount: totalCentavos
            });
            Culqi.open();
        });

        function actualizarResumenEnvio(esDomicilio) {
            const envio = esDomicilio ? COSTO_ENVIO : 0;
            document.getElementById('resumenEnvio').textContent = envio > 0 ? ('S/ ' + envio.toFixed(2)) : 'Gratis';
            document.getElementById('resumenTotal').textContent = 'S/ ' + (SUBTOTAL_CARRITO - descuentoAplicado + envio).toFixed(2);
        }

        document.getElementById('btnAplicarCupon').addEventListener('click', function () {
            const codigo = document.getElementById('inputCupon').value.trim();
            const mensaje = document.getElementById('mensajeCupon');
            if (!codigo) {
                mensaje.textContent = 'Ingresa un código de cupón';
                mensaje.className = 'hint tienda-cupon-error';
                return;
            }
            const headers = {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            };
            headers[CSRF_HEADER] = CSRF_TOKEN;
            fetch(/*[[@{/tienda/cupon/validar}]]*/ '/tienda/cupon/validar', {
                method: 'POST',
                headers: headers,
                body: new URLSearchParams({ codigo: codigo }).toString()
            }).then(function (res) { return res.json(); })
              .then(function (data) {
                  mensaje.textContent = data.mensaje;
                  if (data.valido) {
                      mensaje.className = 'hint tienda-cupon-ok';
                      descuentoAplicado = data.descuento;
                      document.getElementById('codigoCuponAplicado').value = codigo;
                      document.getElementById('filaDescuento').style.display = 'flex';
                      document.getElementById('resumenDescuento').textContent = '- S/ ' + descuentoAplicado.toFixed(2);
                  } else {
                      mensaje.className = 'hint tienda-cupon-error';
                      descuentoAplicado = 0;
                      document.getElementById('codigoCuponAplicado').value = '';
                      document.getElementById('filaDescuento').style.display = 'none';
                  }
                  const domicilioSeleccionado = document.querySelector('input[name="tipoEntrega"]:checked').value === 'DOMICILIO';
                  actualizarResumenEnvio(domicilioSeleccionado);
              });
        });
    </script>
</div>
</body>
</html>
