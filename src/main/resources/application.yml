server:
  port: ${PORT:9096}

app:
  mail:
    # Gmail exige que el "From" coincida con la cuenta autenticada (MAIL_USERNAME);
    # si no se define MAIL_FROM, usamos MAIL_USERNAME para evitar que Gmail rechace el envío.
    remitente: ${MAIL_FROM:${MAIL_USERNAME:no-reply@tiendamas.com}}
  seed:
    # Crea cuentas y catálogo de demo al arrancar (solo aplica fuera del perfil "prod").
    # Poné SEED_DEMO=false si ya tenés tus propios datos y no querés que se generen de nuevo.
    demo: ${SEED_DEMO:true}
  envio:
    # Costo fijo del envío a domicilio (soles) y monto de compra a partir del cual es gratis.
    costo: ${ENVIO_COSTO:12.00}
    montoGratis: ${ENVIO_MONTO_GRATIS:150.00}
  culqui:
    # Llaves de Culqi (https://culqi.com) para cobrar pagos con tarjeta en el checkout.
    # Sin CULQUI_SECRET_KEY, el pago con tarjeta queda deshabilitado automáticamente.
    public-key: ${CULQUI_PUBLIC_KEY:}
    secret-key: ${CULQUI_SECRET_KEY:}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/TiendaMas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123@}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8